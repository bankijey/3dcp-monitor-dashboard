<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3DCP Print Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 23h18M9 18h14M11 13h10M13 8h6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="vendor/plotly.min.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Experiments"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu" aria-label="Open the experiment list">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="tabs" role="tablist" aria-label="Views">
          <button role="tab" id="tab-replay" aria-controls="view-replay" aria-selected="true">Print</button>
          <button role="tab" id="tab-width" aria-controls="view-width" aria-selected="false">Valve step test</button>
        </nav>
        <div class="seg prints" id="prints" role="group" aria-label="Print" hidden></div>
        <button class="icon-btn" id="theme" aria-label="Switch between light and dark">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
        </button>
      </header>
      <main>
        <section id="view-replay" class="view" role="tabpanel" aria-labelledby="tab-replay"></section>
        <section id="view-width" class="view" role="tabpanel" aria-labelledby="tab-width" hidden></section>
      </main>
      <footer class="foot" id="foot" hidden></footer>
    </div>
  </div>
</body>
</html>
