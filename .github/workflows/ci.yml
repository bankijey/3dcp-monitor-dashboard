name: ci

on:
  push:
  pull_request:

jobs:
  monitor:
    # Same OS as the lab PC: the viewer, DLL loading (see the pyarrow/Qt pin in
    # monitor/pyproject.toml) and paths are all exercised as they will run in the lab.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: monitor/pyproject.toml
      - name: Install
        run: pip install -e ".[viewer,acquisition,dev]"
      - name: Lint
        run: ruff check printmon tests inputs_fast.py scan_fast.py
      - name: Test
        # Recorded-data tests skip automatically (data/ is not in git); scanner tests
        # skip without the vendor SDK. Everything else, including the viewer, runs headless.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs
